<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="icon" type="image/x-icon" href="/icon-512.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MessageLMS</title>
  <meta name="description" content="MessageLMS — Gerçek zamanlı oda bazlı sohbet uygulaması. Anlık mesajlaşma." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0f;
      --bg2:       #141417;
      --bg3:       #1a1a1f;
      --bg4:       #222228;
      --border:    #2a2a32;
      --accent:    #c8ff00;
      --accent2:   #a8d900;
      --accent-dim:#c8ff0022;
      --text:      #e8e8ee;
      --text-dim:  #858595;
      --text-muted:#555566;
      --sidebar-w: 240px;
      --radius:    12px;
      --transition: 0.18s cubic-bezier(.4,0,.2,1);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    #app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      position: relative;
    }

    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform var(--transition);
      z-index: 100;
    }

    #logo {
      padding: 20px 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #logo-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
    }
    #logo-text { flex: 1; }
    #logo-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.3px;
    }
    #logo-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
      text-transform: uppercase;
      letter-spacing: .6px;
    }
    #status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: #ff4444;
      color: #fff;
      transition: background var(--transition);
    }
    #status-badge.online { background: #22cc66; }

    #sidebar-close {
      display: none;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      margin-left: auto;
      font-size: 20px;
      line-height: 1;
      flex-shrink: 0;
    }

    #rooms-header {
      padding: 14px 16px 8px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--text-muted);
    }
    #rooms-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px;
    }
    .room-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 13.5px;
      font-weight: 500;
      transition: background var(--transition), color var(--transition);
      margin-bottom: 2px;
    }
    .room-item::before {
      content: '#';
      font-weight: 700;
      color: var(--text-muted);
      font-size: 15px;
      transition: color var(--transition);
    }
    .room-item:hover { background: var(--bg4); color: var(--text); }
    .room-item:hover::before { color: var(--text-dim); }
    .room-item.active { background: var(--accent-dim); color: var(--accent); }
    .room-item.active::before { color: var(--accent); }

    /* Bot odası özel stili */
    .room-item.bot-room::before { content: '🤖'; font-size: 13px; }
    .room-item.bot-room.active  { background: #1a1a3a; color: #a78bfa; }
    .room-item.bot-room.active::before { content: '🤖'; }

    /* Bot mesaj balonu */
    .msg-row.bot .msg-avatar {
      background: linear-gradient(135deg, #6d28d9, #a78bfa);
      color: #fff;
      font-size: 15px;
    }
    .msg-row.bot .msg-bubble {
      background: #1e1b2e;
      border: 1px solid #4c1d95;
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .msg-row.bot .msg-nick { color: #a78bfa; }

    #create-room-area {
      padding: 12px 10px;
      border-top: 1px solid var(--border);
    }
    #create-room-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--text-muted);
      margin-bottom: 7px;
      padding: 0 4px;
    }
    #create-room-row { display: flex; gap: 6px; }
    #room-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 12.5px;
      outline: none;
      transition: border-color var(--transition);
    }
    #room-input::placeholder { color: var(--text-muted); }
    #room-input:focus { border-color: var(--accent); }
    #create-room-btn {
      width: 34px;
      height: 34px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background var(--transition), transform var(--transition);
    }
    #create-room-btn:hover { background: var(--accent2); transform: scale(1.07); }
    #create-room-btn:active { transform: scale(.96); }

    #user-bar {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--bg2);
    }
    #user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #000;
      flex-shrink: 0;
    }
    #user-nick {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #change-nick-btn {
      font-size: 11px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 5px;
      transition: color var(--transition), background var(--transition);
    }
    #change-nick-btn:hover { color: var(--text); background: var(--bg4); }

    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 99;
      backdrop-filter: blur(2px);
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      min-width: 0;
    }

    #chat-header {
      padding: 0 16px 0 12px;
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      flex-shrink: 0;
    }

    #hamburger-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: background var(--transition), color var(--transition);
      flex-shrink: 0;
    }
    #hamburger-btn:hover { background: var(--bg4); color: var(--text); }
    #hamburger-btn svg { display: block; }

    #chat-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #chat-title-hash { color: var(--text-muted); margin-right: 3px; }
    #ws-indicator {
      margin-left: auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      transition: background var(--transition), box-shadow var(--transition);
      flex-shrink: 0;
    }
    #ws-indicator.connected { background: #22cc66; box-shadow: 0 0 8px #22cc6688; }
    #ws-label { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }

    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    #empty-state-icon {
      font-size: 52px;
      opacity: .25;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    #empty-state-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; opacity: .6; }
    #empty-state-sub {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      max-width: 260px;
      line-height: 1.6;
    }

    #messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 80%;
      animation: fadeUp .2s ease;
    }
    .msg-row.other { align-self: flex-start; flex-direction: row; }
    .msg-row.self  { align-self: flex-end;   flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c5af5, #c05af5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .msg-row.self .msg-avatar {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      color: #000;
    }

    .msg-body { display: flex; flex-direction: column; gap: 2px; }
    .msg-row.self .msg-body { align-items: flex-end; }
    .msg-row.other .msg-body { align-items: flex-start; }

    .msg-nick { font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 0 4px; }
    .msg-row.self .msg-nick { color: var(--accent); opacity: .8; }

    .msg-bubble {
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      max-width: 100%;
    }
    .msg-row.other .msg-bubble {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .msg-row.self .msg-bubble {
      background: var(--accent);
      color: #000;
      font-weight: 500;
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 10px;
      color: var(--text-muted);
      padding: 0 6px;
      margin-top: 1px;
      opacity: .7;
      letter-spacing: .2px;
    }

    /* ── Read Receipt ── */
    .msg-receipt {
      display: inline;
      color: #4ade80;
      font-size: 11px;
      margin-left: 3px;
    }
    .msg-receipt .tick {
      font-size: 11px;
      line-height: 1;
    }

    /* ── Context Menu (basılı tut) ── */
    .msg-context-menu {
      position: fixed;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 0;
      min-width: 160px;
      box-shadow: 0 12px 40px rgba(0,0,0,.6);
      z-index: 500;
      animation: fadeUp .15s ease;
    }
    .msg-context-menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 16px;
      background: none;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background var(--transition);
    }
    .msg-context-menu button:hover { background: var(--bg4); }
    .msg-context-menu button.danger { color: #ff6b6b; }
    .msg-context-menu button.danger:hover { background: rgba(255,107,107,.1); }
    .msg-context-menu .menu-icon { font-size: 15px; width: 18px; text-align: center; }
    .msg-context-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* Düzenlendi etiketi */
    .msg-edited {
      font-size: 10px;
      color: var(--text-muted);
      opacity: .7;
      margin-left: 4px;
      font-style: italic;
    }

    /* Düzenleme modu — bubble input */
    .msg-edit-input {
      background: var(--bg4);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      width: 100%;
      resize: none;
      line-height: 1.5;
    }
    .msg-edit-actions {
      display: flex;
      gap: 6px;
      margin-top: 5px;
      justify-content: flex-end;
    }
    .msg-edit-actions button {
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      padding: 5px 12px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      transition: opacity .15s;
    }
    .msg-edit-actions button:hover { opacity: .85; }
    .btn-save  { background: var(--accent); color: #000; }
    .btn-cancel { background: var(--bg4); color: var(--text-dim); border: 1px solid var(--border) !important; }

    /* ── Active Users Badge ── */
    #active-users-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px 4px 8px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
      flex-shrink: 0;
      position: relative;
    }
    #active-users-btn:hover { background: var(--bg4); border-color: var(--accent); color: var(--text); }
    #active-users-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555;
      transition: background var(--transition), box-shadow var(--transition);
    }
    #active-users-dot.online { background: #22cc66; box-shadow: 0 0 6px #22cc6666; }

    #active-users-popup {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 200px;
      max-width: 260px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 0;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
      z-index: 200;
      display: none;
      animation: fadeUp .15s ease;
      max-height: 360px;
      overflow-y: auto;
    }
    #active-users-popup.show { display: block; }
    #active-users-popup-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--text-muted);
      padding: 0 14px 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .users-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .7px;
      color: var(--text-muted);
      padding: 6px 14px 4px;
    }
    .active-user-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      font-size: 13px;
      color: var(--text);
    }
    .active-user-item .user-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .active-user-item .user-dot.online {
      background: #22cc66;
      box-shadow: 0 0 5px #22cc6666;
    }
    .active-user-item .user-dot.offline {
      background: #555566;
    }
    .active-user-item .user-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .active-user-item .user-ago {
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    #active-users-empty {
      padding: 6px 14px;
      font-size: 12px;
      color: var(--text-muted);
    }

    #input-area {
      padding: 10px 16px 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      flex-shrink: 0;
    }

    /* ── Typing Indicator ── */
    #typing-indicator {
      padding: 0 20px 6px;
      min-height: 22px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .2s ease, transform .2s ease;
      pointer-events: none;
    }
    #typing-indicator.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .typing-dots {
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .typing-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: typingBounce 1.2s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .4; }
      30%            { transform: translateY(-5px); opacity: 1; }
    }
    #input-box {
      display: flex;
      align-items: center;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 10px 0 16px;
      gap: 8px;
      transition: border-color var(--transition);
    }
    #input-box:focus-within { border-color: var(--accent); }
    #msg-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 14px 0;
    }
    #msg-input::placeholder { color: var(--text-muted); }
    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      color: #000;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background var(--transition), transform var(--transition);
      white-space: nowrap;
    }
    #send-btn:hover { background: var(--accent2); transform: scale(1.04); }
    #send-btn:active { transform: scale(.97); }
    #input-hint { margin-top: 6px; font-size: 11px; color: var(--text-muted); padding: 0 4px; }

    /* ── Login Modal ── */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    #modal {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px 32px;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      box-shadow: 0 32px 80px rgba(0,0,0,.6);
      animation: modalIn .3s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(.88) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    #modal-icon { font-size: 38px; margin-bottom: 4px; }
    #modal-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; letter-spacing: -.4px; }
    #modal-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
      margin-bottom: 22px;
    }
    #nick-input {
      width: 100%;
      background: var(--bg4);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color var(--transition);
    }
    #nick-input::placeholder { color: var(--text-muted); }
    #nick-input:focus { border-color: var(--accent); }
    #modal-error { font-size: 12px; color: #ff6b6b; margin-bottom: 8px; height: 16px; }
    #login-btn {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 13px;
      color: #000;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .2px;
      transition: background var(--transition), transform var(--transition);
    }
    #login-btn:hover { background: var(--accent2); transform: scale(1.02); }
    #login-btn:active { transform: scale(.98); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 16px;
      left: 16px;
      max-width: 400px;
      margin: 0 auto;
      background: var(--bg4);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      padding: 11px 18px;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .25s, transform .25s;
      z-index: 1000;
      text-align: center;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { border-color: var(--accent); color: var(--accent); }
    #toast.error   { border-color: #ff4444; color: #ff7777; }

    /* ── MOBILE ── */
    @media (max-width: 640px) {
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        height: 100dvh;
        transform: translateX(-100%);
        box-shadow: 4px 0 24px rgba(0,0,0,.5);
      }
      #sidebar.open { transform: translateX(0); }
      #sidebar-overlay.open { display: block; }
      #hamburger-btn {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #sidebar-close {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #main { width: 100%; }
      #input-hint { display: none; }
      #send-btn span:first-child { display: none; }
      .msg-row { max-width: 88%; }
    }
  </style>
</head>
<body>

<!-- Login Modal -->
<div id="modal-overlay">
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-icon">👤</div>
    <div id="modal-title">Kullanıcı Adı</div>
    <div id="modal-sub">Sohbete katılmak için bir takma ad seç.<br>Daha sonra değiştirebilirsin.</div>
    <input id="nick-input" type="text" placeholder="takma_adın..." maxlength="24" autocomplete="off" aria-label="Kullanıcı adı" />
    <div id="modal-error" aria-live="polite"></div>
    <button id="login-btn">Giriş Yap →</button>
  </div>
</div>

<!-- Sidebar Overlay (mobile) -->
<div id="sidebar-overlay"></div>

<!-- App -->
<div id="app">

  <!-- Sidebar -->
  <nav id="sidebar" aria-label="Odalar">
    <div id="logo">
      <div id="logo-icon">M</div>
      <div id="logo-text">
        <div id="logo-name">MessageLMS</div>
        <div id="logo-sub">gerçek zamanlı sohbet uygulaması</div>
      </div>
      <div id="status-badge">●&nbsp;Çevrimdışı</div>
      <button id="sidebar-close" aria-label="Menüyü kapat">✕</button>
    </div>

    <div id="rooms-header">Odalar</div>
    <div id="rooms-list" role="list" aria-label="Oda listesi"></div>

    <div id="create-room-area">
      <div id="create-room-label">Yeni Oda</div>
      <div id="create-room-row">
        <input id="room-input" type="text" placeholder="oda adı..." maxlength="32" aria-label="Oda adı" />
        <button id="create-room-btn" aria-label="Oda oluştur">+</button>
      </div>
    </div>

    <div id="user-bar">
      <div id="user-avatar">?</div>
      <div id="user-nick">—</div>
      <button id="change-nick-btn" aria-label="Kullanıcı adını değiştir">düzenle</button>
    </div>
  </nav>

  <!-- Main -->
  <main id="main">
    <div id="chat-header">
      <button id="hamburger-btn" aria-label="Menüyü aç">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="2" y1="6" x2="20" y2="6"/>
          <line x1="2" y1="11" x2="20" y2="11"/>
          <line x1="2" y1="16" x2="20" y2="16"/>
        </svg>
      </button>
      <div id="chat-title">
        <span id="chat-title-hash"># </span><span id="chat-title-name">Bir oda seç</span>
      </div>
      <button id="active-users-btn" aria-label="Aktif kullanıcılar" title="Aktif kullanıcıları göster">
        <div id="active-users-dot"></div>
        <span id="active-users-count">0</span> aktif
        <div id="active-users-popup" role="tooltip">
          <div id="active-users-popup-title">Çevrimiçi Kullanıcılar</div>
          <div id="active-users-list"><div id="active-users-empty">Henüz kimse yok...</div></div>
        </div>
      </button>
      <div id="ws-indicator"></div>
      <span id="ws-label"></span>
    </div>

    <div id="empty-state">
      <div id="empty-state-icon">💬</div>
      <div id="empty-state-title">MessageLMS</div>
      <div id="empty-state-sub">Soldaki listeden bir odaya katıl<br>ya da yeni bir oda oluştur.</div>
    </div>

    <div id="messages-area" style="display:none;" role="log" aria-live="polite" aria-label="Mesajlar"></div>

    <div id="typing-indicator">
      <div class="typing-dots"><span></span><span></span><span></span></div>
      <span id="typing-text"></span>
    </div>

    <div id="input-area" style="display:none;">
      <div id="input-box">
        <input id="msg-input" type="text" placeholder="Mesaj yaz..." aria-label="Mesaj" />
        <button id="send-btn" aria-label="Gönder">
          <span>Gönder</span>
          <span>✈</span>
        </button>
      </div>
      <div id="input-hint">Enter → gönder &nbsp;·&nbsp; Shift+Enter → yeni satır</div>
    </div>
  </main>
</div>

<div id="toast" role="alert"></div>

<script>
  const BASE = window.location.origin;
  const WS_BASE = BASE.replace(/^http/, 'ws');

  let nick = '';
  let currentRoomId = null;
  let ws = null;

  const modalOverlay      = document.getElementById('modal-overlay');
  const nickInput         = document.getElementById('nick-input');
  const loginBtn          = document.getElementById('login-btn');
  const modalError        = document.getElementById('modal-error');
  const roomsList         = document.getElementById('rooms-list');
  const roomInput         = document.getElementById('room-input');
  const createBtn         = document.getElementById('create-room-btn');
  const messagesArea      = document.getElementById('messages-area');
  const emptyState        = document.getElementById('empty-state');
  const inputArea         = document.getElementById('input-area');
  const msgInput          = document.getElementById('msg-input');
  const sendBtn           = document.getElementById('send-btn');
  const chatTitleName     = document.getElementById('chat-title-name');
  const wsIndicator       = document.getElementById('ws-indicator');
  const wsLabel           = document.getElementById('ws-label');
  const statusBadge       = document.getElementById('status-badge');
  const userAvatar        = document.getElementById('user-avatar');
  const userNickEl        = document.getElementById('user-nick');
  const changeNickBtn     = document.getElementById('change-nick-btn');
  const toast             = document.getElementById('toast');
  const sidebar           = document.getElementById('sidebar');
  const sidebarOverlay    = document.getElementById('sidebar-overlay');
  const hamburgerBtn      = document.getElementById('hamburger-btn');
  const sidebarClose      = document.getElementById('sidebar-close');
  const activeUsersBtn    = document.getElementById('active-users-btn');
  const activeUsersCount  = document.getElementById('active-users-count');
  const activeUsersDot    = document.getElementById('active-users-dot');
  const activeUsersPopup  = document.getElementById('active-users-popup');
  const activeUsersList   = document.getElementById('active-users-list');

  // ── Active Users Popup ──────────────────────────────────────────────────
  activeUsersBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    activeUsersPopup.classList.toggle('show');
  });
  document.addEventListener('click', () => activeUsersPopup.classList.remove('show'));
  activeUsersPopup.addEventListener('click', e => e.stopPropagation());

  function updateActiveUsers(count, users, offline) {
    activeUsersCount.textContent = count;
    activeUsersDot.className = count > 0 ? 'online' : '';

    const onlineUsers  = users   || [];
    const offlineUsers = offline || [];

    if (onlineUsers.length === 0 && offlineUsers.length === 0) {
      activeUsersList.innerHTML = '<div id="active-users-empty">Henüz kimse yok...</div>';
      return;
    }

    let html = '';
    if (onlineUsers.length > 0) {
      html += `<div class="users-section-label">Çevrimiçi</div>`;
      html += onlineUsers.map(u => `
        <div class="active-user-item">
          <span class="user-dot online"></span>
          <span class="user-name">${u}</span>
        </div>`).join('');
    }
    if (offlineUsers.length > 0) {
      html += `<div class="users-section-label" style="margin-top:6px;border-top:1px solid var(--border);padding-top:10px">Çevrimdışı</div>`;
      html += offlineUsers.map(u => `
        <div class="active-user-item">
          <span class="user-dot offline"></span>
          <span class="user-name">${u}</span>
        </div>`).join('');
    }
    activeUsersList.innerHTML = html;
  }

  // ── Hamburger / Sidebar ─────────────────────────────────────────────────
  function openSidebar() {
    sidebar.classList.add('open');
    sidebarOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  hamburgerBtn.addEventListener('click', openSidebar);
  sidebarClose.addEventListener('click', closeSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);

  // ── Toast ────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, type = '') {
    toast.textContent = msg;
    toast.className = 'show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = ''; }, 3000);
  }

  // ── Login ────────────────────────────────────────────────────────────────
  loginBtn.addEventListener('click', doLogin);
  nickInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  async function doLogin() {
    const val = nickInput.value.trim();
    if (!val) { modalError.textContent = 'Kullanıcı adı boş olamaz.'; return; }
    if (val.length < 2) { modalError.textContent = 'En az 2 karakter gir.'; return; }
    if (!/^[\w\-. ]+$/.test(val)) { modalError.textContent = 'Geçersiz karakter kullandın.'; return; }

    try {
      const response = await fetch(`${BASE}/users`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: val })
      });
      if (!response.ok) console.warn("Sunucu hatası: Kullanıcı DB'ye yazılamadı ama devam ediliyor.");
    } catch (e) {
      console.error("Bağlantı hatası: Kullanıcı kaydedilemedi.", e);
    }

    nick = val;
    localStorage.setItem('messagelms_nick', nick);
    setNick(nick);
    modalOverlay.style.display = 'none';
    loadRooms();
    showToast(`Hoş geldin, ${nick}! 🎉`, 'success');
    setupPushNotifications();
  }

  function setNick(n) {
    userNickEl.textContent = n;
    userAvatar.textContent = n[0].toUpperCase();
  }

  changeNickBtn.addEventListener('click', () => {
    localStorage.removeItem('messagelms_nick');
    nickInput.value = nick;
    modalError.textContent = '';
    modalOverlay.style.display = 'flex';
    nickInput.focus();
  });

  // ── Rooms ─────────────────────────────────────────────────────────────────
  async function loadRooms() {
    try {
      const res = await fetch(`${BASE}/rooms`);
      const rooms = await res.json();
      renderRooms(rooms);
      setOnline(true);
    } catch (e) {
      showToast('Sunucuya bağlanılamadı!', 'error');
      setOnline(false);
    }
  }

  function renderRooms(rooms) {
    roomsList.innerHTML = '';
    if (!rooms.length) {
      roomsList.innerHTML = '<div style="padding:10px 14px;font-size:12px;color:var(--text-muted)">Henüz oda yok.</div>';
      return;
    }
    rooms.forEach(r => {
      const el = document.createElement('div');
      const isBotRoom = r.name === 'ai-assistant';
      el.className = 'room-item' + (r.id === currentRoomId ? ' active' : '') + (isBotRoom ? ' bot-room' : '');
      el.textContent = r.name;
      el.setAttribute('role', 'listitem');
      el.setAttribute('tabindex', '0');
      el.setAttribute('aria-label', `Oda: ${r.name}`);
      el.dataset.id = r.id;
      el.dataset.name = r.name;
      el.addEventListener('click', () => { joinRoom(r.id, r.name); closeSidebar(); });
      el.addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(r.id, r.name); });
      roomsList.appendChild(el);
    });
  }

  createBtn.addEventListener('click', createRoom);
  roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') createRoom(); });

  async function createRoom() {
    const name = roomInput.value.trim();
    if (!name) return;
    try {
      await fetch(`${BASE}/rooms`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      roomInput.value = '';
      await loadRooms();
      showToast(`"${name}" odası oluşturuldu ✅`, 'success');
    } catch (e) {
      showToast('Oda oluşturulamadı!', 'error');
    }
  }

  // ── Join Room ──────────────────────────────────────────────────────────────
  async function joinRoom(roomId, roomName) {
    currentRoomId = roomId;
    chatTitleName.textContent = roomName;

    document.querySelectorAll('.room-item').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.id) === roomId);
    });

    emptyState.style.display = 'none';
    messagesArea.style.display = 'flex';
    inputArea.style.display = 'block';
    messagesArea.innerHTML = '';

    try {
      const res = await fetch(`${BASE}/messages/${roomId}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const msgs = await res.json();

      if (!Array.isArray(msgs)) {
        showToast('Sunucu hatası: ' + (msgs.error || JSON.stringify(msgs)), 'error');
      } else if (msgs.length === 0) {
        const hint = document.createElement('div');
        hint.style.cssText = 'text-align:center;color:var(--text-muted);font-size:12px;padding:20px 0';
        hint.textContent = 'Henüz mesaj yok. İlk mesajı sen gönder!';
        messagesArea.appendChild(hint);
      } else {
        msgs.forEach(m => {
          appendMessage(m.nick, m.text, m.nick === nick, m.created_at ? formatTs(m.created_at) : '', m.id, m.edited || false);
        });
      }
      scrollBottom();
    } catch (e) {
      showToast('Mesajlar yüklenemedi: ' + e.message, 'error');
    }

    connectWS(roomId);
    msgInput.focus();
  }

  // ── WebSocket ──────────────────────────────────────────────────────────────
  function connectWS(roomId) {
    if (ws) { ws.close(); ws = null; }
    setWsStatus(false);

    const url = `${WS_BASE}/ws/${roomId}/${encodeURIComponent(nick)}`;
    ws = new WebSocket(url);

    ws.onopen = () => {
      setWsStatus(true);
      // WS bağlandığında offline kullanıcıları da hemen çek
      fetch(`${BASE}/active-users`)
        .then(r => r.json())
        .then(d => updateActiveUsers(d.count, d.users, d.offline))
        .catch(() => {});
    };

    ws.onmessage = e => {
      let data;
      try { data = JSON.parse(e.data); } catch { return; }

      if (data.type === 'active_users') { updateActiveUsers(data.count, data.users, data.offline); return; }
      if (data.type === 'typing')       { showTyping(data.nick); return; }
      if (data.type === 'stop_typing')  { clearTyping(data.nick); return; }
      if (data.type === 'delete') {
        const delRow = messagesArea.querySelector(`[data-msg-id="${data.msg_id}"]`);
        if (delRow) { delRow.remove(); msgMap.delete(data.msg_id); }
        return;
      }

      if (data.type === 'edit') {
        const editRow = messagesArea.querySelector(`[data-msg-id="${data.msg_id}"]`);
        if (editRow) {
          const bbl = editRow.querySelector('.msg-bubble');
          if (bbl) {
            bbl.textContent = data.text;
            if (!bbl.querySelector('.msg-edited')) {
              const tag = document.createElement('span');
              tag.className = 'msg-edited';
              tag.textContent = '(düzenlendi)';
              bbl.appendChild(tag);
            }
          }
        }
        return;
      }

      if (data.type === 'read') { return; } // okundu sistemi kaldırıldı

  // ── Bildirim Sesi ─────────────────────────────────────────────────────────
  const _isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  let _audioCtx = null;
  let _currentOsc = null;

  function playNotificationSound() {
    if (_isMobile) return;
    try {
      if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (_audioCtx.state === 'suspended') { _audioCtx.resume(); return; }
      if (_currentOsc) { try { _currentOsc.stop(); } catch(_){} _currentOsc = null; }
      const osc  = _audioCtx.createOscillator();
      const gain = _audioCtx.createGain();
      osc.connect(gain);
      gain.connect(_audioCtx.destination);
      osc.type = 'sine';
      const t = _audioCtx.currentTime;
      osc.frequency.setValueAtTime(880, t);
      osc.frequency.exponentialRampToValueAtTime(440, t + 0.15);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t);
      osc.stop(t + 0.3);
      _currentOsc = osc;
      osc.onended = () => { _currentOsc = null; try { gain.disconnect(); osc.disconnect(); } catch(_){} };
    } catch (_) {}
  }

      if (data.type === 'message') {
        clearTyping(data.nick);
        if (data.nick !== nick) {
          appendMessage(data.nick, data.text, false, data.ts, data.msg_id);
          scrollBottom();
          playNotificationSound();
        } else {
          const pending = pendingSelfMsgs.shift();
          if (pending && data.msg_id) {
            msgMap.set(data.msg_id, pending);
            msgMap.delete(pending._tmpId);
          }
        }
      }
    };

    ws.onclose = () => setWsStatus(false);
    ws.onerror = () => {
      setWsStatus(false);
      showToast('Bağlantı kesildi, yeniden deneniyor...', 'error');
    };
  }

  function setWsStatus(connected) {
    wsIndicator.className = connected ? 'connected' : '';
    wsLabel.textContent = connected ? 'Aktif' : 'Bağlantı yok';
  }

  function setOnline(on) {
    statusBadge.textContent = on ? 'Çevrimiçi' : 'Çevrimdışı';
    statusBadge.className = on ? 'online' : '';
  }

  // ── Send ───────────────────────────────────────────────────────────────────
  sendBtn.addEventListener('click', sendMsg);
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });

  let typingThrottle = null;
  msgInput.addEventListener('input', () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (!msgInput.value) {
      ws.send(JSON.stringify({ type: 'stop_typing' }));
      clearTimeout(typingThrottle);
      typingThrottle = null;
      return;
    }
    if (typingThrottle) return;
    ws.send(JSON.stringify({ type: 'typing' }));
    typingThrottle = setTimeout(() => { typingThrottle = null; }, 2000);
  });

  const pendingSelfMsgs = [];

  function sendMsg() {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      showToast('Bağlantı yok, yeniden bağlanıyor...', 'error');
      if (currentRoomId) connectWS(currentRoomId);
      return;
    }
    const text = msgInput.value.trim();
    if (!text) return;
    msgInput.value = '';

    const tmpId = 'tmp_' + Date.now();
    const nowTs = formatNow();
    appendMessage(nick, text, true, nowTs, tmpId);
    scrollBottom();

    const entry = msgMap.get(tmpId);
    if (entry) { entry._tmpId = tmpId; pendingSelfMsgs.push(entry); }

    ws.send(text);
    clearTimeout(typingThrottle);
    typingThrottle = null;
  }

  // ── Typing Indicator ───────────────────────────────────────────────────────
  const typingIndicator = document.getElementById('typing-indicator');
  const typingText      = document.getElementById('typing-text');
  const typingTimers = {};
  const typingUsers = new Set();

  function showTyping(senderNick) {
    typingUsers.add(senderNick);
    renderTyping();
    clearTimeout(typingTimers[senderNick]);
    typingTimers[senderNick] = setTimeout(() => clearTyping(senderNick), 3000);
  }

  function clearTyping(senderNick) {
    typingUsers.delete(senderNick);
    clearTimeout(typingTimers[senderNick]);
    delete typingTimers[senderNick];
    renderTyping();
  }

  function renderTyping() {
    const list = [...typingUsers];
    if (list.length === 0) {
      typingIndicator.classList.remove('visible');
      typingText.textContent = '';
    } else {
      let label;
      if (list.length === 1)      label = `${list[0]} yazıyor...`;
      else if (list.length === 2) label = `${list[0]} ve ${list[1]} yazıyor...`;
      else                        label = `${list.length} kişi yazıyor...`;
      typingText.textContent = label;
      typingIndicator.classList.add('visible');
    }
  }

  // ── Timestamp helpers ──────────────────────────────────────────────────────
  function formatNow() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} | ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function formatTs(raw) {
    if (!raw) return '';
    try {
      const d = new Date(raw.replace(' ', 'T'));
      if (isNaN(d)) return raw;
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} | ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    } catch { return raw; }
  }

  // ── Message Map ───────────────────────────────────────────────────────────
  const msgMap = new Map();

  // ── Render Message ─────────────────────────────────────────────────────────
  function appendMessage(senderNick, text, _isSelf, ts = '', msgId = null, edited = false) {
    const hint = messagesArea.querySelector('.no-msg-hint');
    if (hint) hint.remove();

    const row = document.createElement('div');
    const isSelf = senderNick === nick;
    const isBot  = senderNick === '🤖 AI';
    row.className = 'msg-row ' + (isBot ? 'other bot' : isSelf ? 'self' : 'other');
    if (msgId) row.dataset.msgId = msgId;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = senderNick[0].toUpperCase();

    const body = document.createElement('div');
    body.className = 'msg-body';

    const nickEl = document.createElement('div');
    nickEl.className = 'msg-nick';
    nickEl.textContent = senderNick;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    if (edited) {
      const editedTag = document.createElement('span');
      editedTag.className = 'msg-edited';
      editedTag.textContent = '(düzenlendi)';
      bubble.appendChild(editedTag);
    }

    body.appendChild(nickEl);
    body.appendChild(bubble);

    if (ts) {
      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.textContent = ts;
      if (isSelf && msgId) {
        const receipt = document.createElement('span');
        receipt.className = 'msg-receipt';
        receipt.innerHTML = ' <span class="tick">✓</span>';
        timeEl.appendChild(receipt);
        msgMap.set(msgId, { receiptEl: receipt });
      }
      body.appendChild(timeEl);
    } else if (isSelf && msgId) {
      const receipt = document.createElement('span');
      receipt.className = 'msg-receipt';
      receipt.innerHTML = '<span class="tick">✓</span>';
      body.appendChild(receipt);
      msgMap.set(msgId, { receiptEl: receipt });
    }

    row.appendChild(avatar);
    row.appendChild(body);
    messagesArea.appendChild(row);

    // ── Basılı tut → context menu (sadece kendi mesajları) ───────────────────
    if (isSelf && msgId && !String(msgId).startsWith('tmp_')) {
      let pressTimer = null;

      const showMenu = (clientX, clientY) => {
        closeContextMenu();
        const menu = document.createElement('div');
        menu.className = 'msg-context-menu';
        menu.id = 'active-context-menu';

        const editBtn = document.createElement('button');
        editBtn.innerHTML = '<span class="menu-icon">✏️</span> Düzenle';
        editBtn.addEventListener('click', () => { closeContextMenu(); startEdit(row, msgId, bubble); });

        const divider = document.createElement('div');
        divider.className = 'msg-context-divider';

        const delBtn = document.createElement('button');
        delBtn.className = 'danger';
        delBtn.innerHTML = '<span class="menu-icon">🗑️</span> Sil';
        delBtn.addEventListener('click', () => { closeContextMenu(); deleteMsg(row, msgId); });

        menu.appendChild(editBtn);
        menu.appendChild(divider);
        menu.appendChild(delBtn);
        document.body.appendChild(menu);

        // Ekrandan taşmasın
        const mw = 170, mh = 100;
        let x = clientX, y = clientY;
        if (x + mw > window.innerWidth)  x = window.innerWidth - mw - 8;
        if (y + mh > window.innerHeight) y = clientY - mh;
        menu.style.left = x + 'px';
        menu.style.top  = y + 'px';
      };

      // Masaüstü: sağ tık veya basılı tut (600ms)
      bubble.addEventListener('contextmenu', e => {
        e.preventDefault();
        showMenu(e.clientX, e.clientY);
      });
      bubble.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        pressTimer = setTimeout(() => showMenu(e.clientX, e.clientY), 600);
      });
      bubble.addEventListener('mouseup',   () => clearTimeout(pressTimer));
      bubble.addEventListener('mousemove', () => clearTimeout(pressTimer));

      // Touch (mobil): basılı tut
      bubble.addEventListener('touchstart', e => {
        const t = e.touches[0];
        pressTimer = setTimeout(() => {
          showMenu(t.clientX, t.clientY);
          e.preventDefault();
        }, 500);
      }, { passive: false });
      bubble.addEventListener('touchend',   () => clearTimeout(pressTimer));
      bubble.addEventListener('touchmove',  () => clearTimeout(pressTimer));
    }

    return row;
  }

  // ── Context Menu Helpers ───────────────────────────────────────────────────
  function closeContextMenu() {
    const m = document.getElementById('active-context-menu');
    if (m) m.remove();
  }
  document.addEventListener('mousedown', e => {
    const m = document.getElementById('active-context-menu');
    if (m && !m.contains(e.target)) closeContextMenu();
  });
  document.addEventListener('touchstart', (e) => {
    const m = document.getElementById('active-context-menu');
    if (m && !m.contains(e.target)) closeContextMenu();
  });

  // ── Mesaj Sil ─────────────────────────────────────────────────────────────
  async function deleteMsg(row, msgId) {
    try {
      const res = await fetch(`${BASE}/messages/${msgId}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nick })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      // Sunucu WS üzerinden broadcast edecek, ama optimistic olarak da kaldır
      row.remove();
      msgMap.delete(msgId);
    } catch (e) {
      showToast('Silinemedi: ' + e.message, 'error');
    }
  }

  // ── Mesaj Düzenle ──────────────────────────────────────────────────────────
  function startEdit(row, msgId, bubble) {
    const originalText = bubble.childNodes[0]?.textContent?.trim() || bubble.textContent.trim();
    const body = row.querySelector('.msg-body');

    // Bubble'ı gizle, textarea göster
    bubble.style.display = 'none';

    const textarea = document.createElement('textarea');
    textarea.className = 'msg-edit-input';
    textarea.value = originalText;
    textarea.rows = Math.max(1, Math.ceil(originalText.length / 40));

    const actions = document.createElement('div');
    actions.className = 'msg-edit-actions';

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-cancel';
    cancelBtn.textContent = 'İptal';
    cancelBtn.addEventListener('click', () => {
      textarea.remove();
      actions.remove();
      bubble.style.display = '';
    });

    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn-save';
    saveBtn.textContent = 'Kaydet';
    saveBtn.addEventListener('click', () => saveEdit(row, msgId, bubble, textarea, actions, originalText));

    textarea.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveBtn.click(); }
      if (e.key === 'Escape') cancelBtn.click();
    });

    actions.appendChild(cancelBtn);
    actions.appendChild(saveBtn);

    // receipt'in önüne ekle
    const receipt = body.querySelector('.msg-receipt');
    if (receipt) {
      body.insertBefore(textarea, receipt);
      body.insertBefore(actions, receipt);
    } else {
      body.appendChild(textarea);
      body.appendChild(actions);
    }

    textarea.focus();
    textarea.setSelectionRange(textarea.value.length, textarea.value.length);
  }

  async function saveEdit(row, msgId, bubble, textarea, actions, originalText) {
    const newText = textarea.value.trim();
    if (!newText || newText === originalText) {
      textarea.remove(); actions.remove(); bubble.style.display = ''; return;
    }
    try {
      const res = await fetch(`${BASE}/messages/${msgId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nick, text: newText })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      // Sunucu WS broadcast edecek, optimistic güncelle
      textarea.remove(); actions.remove();
      bubble.style.display = '';
      bubble.textContent = newText;
      if (!bubble.querySelector('.msg-edited')) {
        const tag = document.createElement('span');
        tag.className = 'msg-edited';
        tag.textContent = '(düzenlendi)';
        bubble.appendChild(tag);
      }
    } catch (e) {
      showToast('Düzenlenemedi: ' + e.message, 'error');
    }
  }

  function scrollBottom() {
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }

  // ── Service Worker & Push ──────────────────────────────────────────────────
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('[SW] Registered, scope:', reg.scope))
      .catch(err => console.error('[SW] Registration failed:', err));

    navigator.serviceWorker.addEventListener('message', event => {
      if (event.data?.type === 'OPEN_ROOM' && nick) {
        const { room_id, room_name } = event.data;
        joinRoom(room_id, room_name || String(room_id));
      }
    });
  }

  // ── Auto-login from localStorage ───────────────────────────────────────────
  (async () => {
    const savedNick = localStorage.getItem('messagelms_nick');
    if (savedNick) {
      nick = savedNick;
      setNick(nick);
      modalOverlay.style.display = 'none';
      await loadRooms();
      await setupPushNotifications();
    } else {
      nickInput.focus();
    }
  })();

  async function setupPushNotifications() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    try {
      const cfg = await fetch('/config').then(r => r.json());
      if (!cfg.vapid_public_key) return;

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') { console.log('[Push] Permission denied'); return; }

      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();

      // Mevcut subscription varsa VAPID key'i kontrol et
      if (sub) {
        const existingKey = btoa(String.fromCharCode(...new Uint8Array(sub.options.applicationServerKey)));
        const serverKey   = cfg.vapid_public_key.replace(/-/g, '+').replace(/_/g, '/');
        if (!serverKey.startsWith(existingKey.substring(0, 20))) {
          // Key mismatch — eski subscription'ı sil
          await sub.unsubscribe();
          sub = null;
          console.log('[Push] VAPID key değişmiş, yeniden subscribe olunuyor...');
        }
      }

      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly:      true,
          applicationServerKey: urlBase64ToUint8Array(cfg.vapid_public_key),
        });
      }

      const res  = await fetch('/subscribe', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ nick, subscription: sub.toJSON() }),
      });
      const json = await res.json();
      if (json.ok) {
        console.log('[Push] Subscription registered for', nick);
      }
    } catch (err) {
      console.error('[Push] Setup error:', err);
    }
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64  = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw     = atob(base64);
    const arr     = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  nickInput.focus();
</script>
